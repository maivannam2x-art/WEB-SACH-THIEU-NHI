name: Upload media to Cloudinary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudinary-upload.yml'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch media from existing preview and upload to Cloudinary
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_NAME='dh8xlfsvq'
          API_KEY='372362698139885'
          TS='1789380372'
          BASES=(
            'https://canh-giay-test-ah31hil1a-lamprrro1234-2289.vercel.app'
            'https://canh-giay-binary-test-5eo6z48oi-lamprrro1234-2289.vercel.app'
          )
          mkdir -p media

          fetch_one() {
            local out="$1"; shift
            for base in "${BASES[@]}"; do
              for path in "$@"; do
                echo "Trying ${base}${path}"
                if curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 "${base}${path}" -o "$out"; then
                  if [ -s "$out" ]; then
                    echo "Fetched $out ($(wc -c < "$out") bytes)"
                    return 0
                  fi
                fi
              done
            done
            echo "Could not fetch $out" >&2
            return 1
          }

          fetch_one media/logo '/assets/logo.png' '/assets-opt/logo.webp' '/assets-tiny/logo.webp' '/logo.png' '/logo.webp'
          fetch_one media/video.mp4 '/assets/canh-giay-30s.mp4' '/assets-opt/canh-giay-30s.mp4' '/assets-tiny/canh-giay-30s.mp4' '/canhgiay-video-mini.mp4'
          fetch_one media/dream-loop.webp '/assets/dream-loop.webp' '/assets-opt/dream-loop.webp' '/assets-tiny/dream-loop.webp'
          fetch_one media/poster.jpg '/assets/poster.jpg' '/assets-opt/poster.jpg' '/assets-tiny/poster.jpg'
          fetch_one media/scene-fairytale.jpg '/assets/scene-fairytale.jpg' '/assets-opt/scene-fairytale.jpg' '/assets-tiny/scene-fairytale.jpg'
          fetch_one media/scene-family.jpg '/assets/scene-family.jpg' '/assets-opt/scene-family.jpg' '/assets-tiny/scene-family.jpg'
          fetch_one media/scene-friends.jpg '/assets/scene-friends.jpg' '/assets-opt/scene-friends.jpg' '/assets-tiny/scene-friends.jpg'
          fetch_one media/scene-space.jpg '/assets/scene-space.jpg' '/assets-opt/scene-space.jpg' '/assets-tiny/scene-space.jpg'

          upload() {
            local rtype="$1" file="$2" pid="$3" sig="$4"
            curl -fsS -X POST "https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${rtype}/upload" \
              -F "file=@${file}" \
              -F "api_key=${API_KEY}" \
              -F "timestamp=${TS}" \
              -F "public_id=${pid}" \
              -F "overwrite=true" \
              -F "signature=${sig}"
          }

          : > cloudinary-results.jsonl
          upload image media/logo 'canh-giay/logo' '7b49b19d25dfbd3bfc2608f4d7e0bbcee573d61c' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload video media/video.mp4 'canh-giay/video-30s' '1a55e13f41e8d1cd8f5e00abd7c7c2faacdece85' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/dream-loop.webp 'canh-giay/dream-loop' '1d077046dcf7a370b57fbc55e6d760e911cd9f01' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/poster.jpg 'canh-giay/poster' 'b9d7ed8cd2e6f4d111ef202d4f2cd9566fc018f6' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/scene-fairytale.jpg 'canh-giay/scene-fairytale' '39e124f64055fbbac258923c00f4e834caa82770' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/scene-family.jpg 'canh-giay/scene-family' '04e6616d55ec6f95b961c5d013d64ea990cd996c' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/scene-friends.jpg 'canh-giay/scene-friends' '241a6f72e3b7a4de2f44af873fdb43a419c0f277' | tee -a cloudinary-results.jsonl
          echo >> cloudinary-results.jsonl
          upload image media/scene-space.jpg 'canh-giay/scene-space' '280cb59542050bbf7c4455b919e2a468d44e84bc' | tee -a cloudinary-results.jsonl

      - name: Save Cloudinary responses
        uses: actions/upload-artifact@v4
        with:
          name: cloudinary-results
          path: cloudinary-results.jsonl
          retention-days: 1
